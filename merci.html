li{margin-bottom:6px}
strong{color:var(--ink)}

.card{padding:18px 20px;border:1.5px solid var(--line-2);border-radius:var(--r-md);background:var(--sheet)}
.card p:last-child{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.7em 1.3em;border-radius:var(--r-sm);border:1.5px solid var(--ink);background:var(--accent);color:#141410;border-color:#FC4C14;font:650 1rem/1.1 var(--ff);text-decoration:none;box-shadow:none}
